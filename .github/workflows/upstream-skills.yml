name: Upstream skills

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Check only, or synchronize changes into a pull request
        required: true
        default: check
        type: choice
        options:
          - check
          - sync

permissions:
  contents: read

concurrency:
  group: upstream-skills-${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'check' }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'schedule' || inputs.operation == 'check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate DCS
        run: python3 tools/sync_upstreams.py --validate
      - name: Check upstream skills
        run: python3 tools/sync_upstreams.py --check

  sync:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'sync'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize upstream skills
        id: sync
        run: >-
          python3 tools/sync_upstreams.py
          --sync
          --bump-plugin-version
          --report "$RUNNER_TEMP/upstream-sync.md"
      - name: Open update pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/sync-upstream-skills-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .codex-plugin/plugin.json skills
          git commit -m "chore: sync upstream skills"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: sync upstream skills" \
            --body-file "$RUNNER_TEMP/upstream-sync.md"
