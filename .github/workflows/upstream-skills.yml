name: Upstream skills

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Check only, or synchronize changes onto an update branch
        required: true
        default: check
        type: choice
        options:
          - check
          - sync

permissions:
  contents: read

concurrency:
  group: upstream-skills-${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'check' }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'schedule' || inputs.operation == 'check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate DCS
        run: python3 tools/sync_upstreams.py --validate
      - name: Check upstream skills
        run: python3 tools/sync_upstreams.py --check

  sync:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'sync'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize upstream skills
        id: sync
        run: >-
          python3 tools/sync_upstreams.py
          --sync
          --bump-plugin-version
      - name: Push update branch
        if: steps.sync.outputs.changed == 'true'
        run: |
          branch="automation/sync-upstream-skills-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .codex-plugin/plugin.json skills
          git commit -m "chore: sync upstream skills"
          git push origin "$branch"
          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          {
            printf '\n## Open the update pull request\n\n'
            printf '[Review the imported changes and open a pull request](%s).\n' "$compare_url"
          } >> "$GITHUB_STEP_SUMMARY"
